name: Calculate APK SHA-256
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Calculate SHA-256
        run: |
          sha256sum releases/LiquidGlassCalculator.apk | tee releases/LiquidGlassCalculator.apk.sha256
          cat releases/LiquidGlassCalculator.apk.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Publish checksum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/LiquidGlassCalculator.apk.sha256
          git commit -m "Add APK SHA-256 checksum" || exit 0
          git push
